name: Build, push and deploy CoffeeNChill

on:
  push:
    branches:
      - main
    paths-ignore:
      - "**.md"              # a README change must not redeploy the system
      - "docs/**"
  workflow_dispatch:         # also gives a "Run workflow" button on GitHub

# Never run two deployments at the same time.
concurrency:
  group: deploy-coffeenchill
  cancel-in-progress: false

env:
  IMAGE_VERSION: v3.0
  GATEWAY_IMAGE: st10482062/coffeenchill-gateway
  FUNCTIONS_IMAGE: st10482062/coffeenchill-functions

jobs:
  build-push-deploy:
    runs-on: ubuntu-latest
    steps:
      # STEP 1: get the code and the .NET 9 SDK
      - name: 1a. Check out the code
        uses: actions/checkout@v4

      - name: 1b. Set up the .NET 9 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x

      # STEP 2: build (this fails the pipeline if the code does not compile)
      - name: 2a. Build the gateway
        run: dotnet build src/CoffeeNChill.Gateway --configuration Release

      - name: 2b. Build the Functions
        run: dotnet build src/CoffeeNChill.Functions --configuration Release

      # STEP 3 and 4: Docker images, login, push
      - name: 3. Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: 4a. Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: 4b. Build and push the gateway image
        uses: docker/build-push-action@v6
        with:
          context: src/CoffeeNChill.Gateway
          push: true
          tags: |
            ${{ env.GATEWAY_IMAGE }}:${{ env.IMAGE_VERSION }}
            ${{ env.GATEWAY_IMAGE }}:3.0.${{ github.run_number }}
          cache-from: type=gha,scope=gateway
          cache-to: type=gha,mode=max,scope=gateway

      - name: 4c. Build and push the Functions image
        uses: docker/build-push-action@v6
        with:
          context: src/CoffeeNChill.Functions
          push: true
          tags: |
            ${{ env.FUNCTIONS_IMAGE }}:${{ env.IMAGE_VERSION }}
            ${{ env.FUNCTIONS_IMAGE }}:3.0.${{ github.run_number }}
          cache-from: type=gha,scope=functions
          cache-to: type=gha,mode=max,scope=functions

      # STEP 5: log in to the VPS and restart the stack with the new images
      - name: 5. Deploy to the VPS over SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            cd ~/coffeenchill
            docker compose pull
            docker compose up -d
            docker image prune -f
            docker compose ps
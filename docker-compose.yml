# The Azurite connection text, written once and reused below. This is the public Azurite development account, the same on every PC.

x-azurite-connection: &azurite-connection "DefaultEndpointsProtocol=http;AccountName=devstoreaccount1;AccountKey=Eby8vdM02xNOcqFlqUwJPLlmEtlCDXJ1OUzFT50uSRZ6IFsuFq2UVErCz4I6tq/K1SZFPTOtr/KBHBeksoGMGw==;BlobEndpoint=http://azurite:10000/devstoreaccount1;QueueEndpoint=http://azurite:10001/devstoreaccount1;TableEndpoint=http://azurite:10002/devstoreaccount1;"

services:

  # Pretend Azure Storage (Blob 10000, Queue 10001, Table 10002). Only reachable from this computer.

  azurite:

    image: st10482062/coffeenchill-azurite:${IMAGE_TAG:-v3.0}

    command: azurite --skipApiVersionCheck --blobHost 0.0.0.0 --queueHost 0.0.0.0 --tableHost 0.0.0.0 --location /data

    ports:

      - "127.0.0.1:10000:10000"

      - "127.0.0.1:10001:10001"

      - "127.0.0.1:10002:10002"

    volumes:

      - azurite-data:/data

    networks:

      - coffeenchill-net

    restart: unless-stopped

  # The Part 2 Azure Functions app: queue worker and order lookups. NOT open to the internet (no login on these routes).

  functions:

    image: st10482062/coffeenchill-functions:${IMAGE_TAG:-v3.0}

    depends_on:

      - azurite

    ports:

      - "127.0.0.1:7071:80"

    environment:

      AzureWebJobsStorage: *azurite-connection

      STATUS_STEP_DELAY_SECONDS: "30"

      ENABLE_POISON_TEST: "false"

    networks:

      - coffeenchill-net

    restart: unless-stopped

  # The Part 3 API gateway: login, JWT, roles, Swagger and one public URL for everything. The only service open to the world.

  gateway:

    image: st10482062/coffeenchill-gateway:${IMAGE_TAG:-v3.0}

    depends_on:

      - azurite

      - functions

    ports:

      - "5000:8080"

    environment:

      ASPNETCORE_ENVIRONMENT: "Production"

      AzureStorageConnectionString: *azurite-connection

      Functions__BaseUrl: "http://functions/api"

      Jwt__Key: "${JWT_KEY:-}"

      Jwt__Issuer: "CoffeeNChillGateway"

      Jwt__Audience: "CoffeeNChillUsers"

      Jwt__ExpiryHours: "2"

      SeedAdmin__Email: "${SEED_ADMIN_EMAIL:-}"

      SeedAdmin__Password: "${SEED_ADMIN_PASSWORD:-}"

      SeedAdmin__FullName: "CoffeeNChill Admin"

      Swagger__Enabled: "true"

    networks:

      - coffeenchill-net

    restart: unless-stopped

networks:

  coffeenchill-net:

    driver: bridge

volumes:

  azurite-data:

